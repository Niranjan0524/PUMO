[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumo-multimodal-routing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "pyarrow>=18", "geopandas>=1.0",
  "shapely>=2.0", "pyproj>=3.7", "scipy>=1.14", "pyyaml>=6.0",
  "pyrosm>=0.21", "psutil>=6.0", "matplotlib>=3.9"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
